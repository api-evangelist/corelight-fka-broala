aid: corelight-fka-broala
name: Corelight (fka Broala)
description: >-
  Corelight is a network detection and response (NDR) company founded by the
  creators of the open-source Zeek (formerly Bro) network security monitor. Its
  Open NDR platform transforms raw network traffic into high-fidelity security
  evidence using the Zeek and Suricata engines, giving security teams the data
  they need for threat detection, investigation, threat hunting, and incident
  response across on-premises, cloud, and hybrid environments. Corelight Sensor
  appliances can be configured and operated remotely through a RESTful API; the
  public, open-source surface for that API is the corelight-client command-line
  tool (also on PyPI). Corelight maintains an active open-source presence on
  GitHub, contributing Zeek packages, protocol analyzers, and cloud
  infrastructure-as-code. The company (formerly Broala) is backed by Insight
  Partners and publishes a Trust & Compliance program covering SOC 2, ISO 27001,
  NIST CSF, CMMC Level 2, and NIST SP 800-171.
